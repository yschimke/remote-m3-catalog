name: Typed M3 catalogs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'catalog-typed-*/**'
      - '**/src/**'
      - '**/catalog.spec.json'
      - 'catalog.spec.json'
      - 'scripts/validate-typed-m3-catalogs.sh'
      - '**/ui-builder.policy.json'
      - 'ui-builder.policy.json'
      - 'gradle/libs.versions.toml'
      - 'scripts/validate-typed-m3-policies.sh'
      - 'scripts/validate-typed-remote-pilot.sh'
      - 'settings.gradle.kts'
      - 'remote-catalog/ui-builder/designs/**'
      - 'vendor/**'
      - '.github/workflows/typed-catalog.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate independent Kotlin policies
        run: scripts/validate-typed-m3-policies.sh
      - name: Validate complete Kotlin catalog pairs
        run: scripts/validate-typed-m3-catalogs.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: typed-m3-policies
          path: |
            catalog-typed-generator/build/catalog/
            catalog-typed-generator/build/reports/tests/
            catalog-typed-policy/build/catalog/
            catalog-typed-policy/build/reports/tests/

  # The typed-export pilot (docs/design/TYPED_REMOTE_PILOT.md): real-record definitions on the
  # Remote Compose composables, the hidden `remote-m3-typed-pilot` pair, and every committed remote
  # design exported through compose-ui-builder's generic `compose-component-records` export, each
  # refusal pinned. Opt-in (`-PtypedRemoteCatalog=true`); nothing here publishes.
  remote-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      # The two releases the pilot's projections are written against, as source. Pinned to the
      # tags, never `main`: a pilot floating on either head would go red for a change nobody here
      # made.
      - uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ui-builder
          ref: 34701265c982e3fb50f7d2f91332a705cff84bd7 # v3.109.0
          path: .typed-builder
      - uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: 9310fba0525c3d146736f23aa95626cac5ac8e21 # v2.52.0
          path: .typed-tools
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate the typed Remote export pilot
        run: scripts/validate-typed-remote-pilot.sh .typed-tools .typed-builder
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: typed-remote-pilot
          path: |
            catalog-typed-adapters/build/catalog/
            catalog-typed-adapters/build/reports/tests/
