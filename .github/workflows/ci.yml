name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # WHY THIS JOB EXISTS. The four checks below are REQUIRED on the `Protect Main` ruleset
  # (renovate-config's `repo-policy/` names them: Build + discover previews, Unit tests,
  # ktfmtCheck, Validate catalog spec), and a job filtered out by `paths:` never reports at all — a
  # required check that never reports BLOCKS the merge rather than passing it. So the cheap way to
  # stop a docs-only pull request spending 30 minutes of runner on an assemble, a discovery and a
  # render — `paths-ignore:` on the trigger — would wedge exactly the pull requests it is meant to
  # make cheap (#489).
  #
  # Every job therefore still RUNS and still reports; what this job decides is whether their steps
  # do anything. Same shape `design-artifacts.yml` already uses for its three publish lanes, and the
  # only option that is safe whatever the ruleset requires.
  changes:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      inert: ${{ steps.scope.outputs.inert }}
    steps:
      # `fetch-depth: 2` is what makes the diff below possible and is the whole reason this job is
      # separate from the ones it gates: on a pull request the checked-out commit is the MERGE of
      # the head and the base, so depth 2 brings both parents and `HEAD^1..HEAD` is exactly this
      # pull request's change set — no base-branch fetch, no API call.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          # INERT MEANS "CANNOT CHANGE WHAT ANY CHECK BELOW WOULD SAY", and anything this cannot
          # prove is not inert: a dispatch, a push whose predecessor is unknown, a diff that does
          # not resolve and an empty change set all run everything. Skipping a check that would
          # have failed is the only expensive mistake here; running one that would have passed
          # costs a runner.
          files=''
          case "${{ github.event_name }}" in
            pull_request)
              files="$(git diff --name-only HEAD^1 HEAD)" || files='' ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != '0000000000000000000000000000000000000000' ]; then
                files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")" || files=''
              fi ;;
          esac
          if [ -z "$files" ]; then
            echo 'inert=false' >> "$GITHUB_OUTPUT"
            echo 'Change set unavailable or empty: running everything.'
            exit 0
          fi
          # THE TWO EXCEPTIONS COME FIRST, because both are matched by the inert patterns below and
          # both are real inputs to this workflow. `docs/KIT_COVERAGE.md` is GENERATED and gated in
          # the build job (`kit-coverage.mjs --check`), so a hand-edit to it is precisely what that
          # check exists to catch — it is the one markdown file in the tree that is not prose. And
          # `ci.yml` is this file: a change to it must run under itself.
          if grep -qE '^(docs/KIT_COVERAGE\.md|\.github/workflows/ci\.yml)$' <<<"$files"; then
            echo 'inert=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Prose (`**/*.md`, `docs/**` — which is prose and the images it embeds — and `LICENSE`),
          # and OTHER workflows. That last one is what #489 was raised about: #488 changed one file,
          # `.github/workflows/design-artifacts.yml`, and started an assemble, a discovery and a
          # render that no line of it could reach. A sibling workflow is not an input to any check
          # here; `.github/actions/**`, `.github/scripts/**` and `.github/ci/**` ARE (the setup
          # action, `test-agent-gradle.sh`, the snapshot pin Gradle reads), so they are deliberately
          # absent from this list and keep the full run.
          if grep -qvE '^(LICENSE|.*\.md|docs/.*|\.github/workflows/[^/]+\.yml)$' <<<"$files"; then
            echo 'inert=false' >> "$GITHUB_OUTPUT"
          else
            echo 'inert=true' >> "$GITHUB_OUTPUT"
            echo 'Prose or sibling-workflow change only; every check below reports without running.'
          fi

  build:
    name: Build + discover previews
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `issues: read` for the locator check at the end of this job; everything else reads the tree.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.inert != 'true'
      - name: Test automated Gradle launcher
        if: needs.changes.outputs.inert != 'true'
        run: .github/scripts/test-agent-gradle.sh
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.inert != 'true'
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Published Remote Compose changes bump the version
        if: needs.changes.outputs.inert != 'true' && github.event_name == 'pull_request'
        run: .github/scripts/check-remote-compose-port-revision.sh HEAD^1

      - name: Assemble
        if: needs.changes.outputs.inert != 'true'
        run: ./gradlew :remote-catalog:assembleDebug --stacktrace

      # Discovery is the real contract for a design catalog: it is what proves every `@Preview` the
      # spec names still exists and still compiles against the alpha Remote Compose line, and it
      # turns the `@CatalogComponent` annotations into the published inventory.
      #
      # `-PremoteSnapshot=` — an EMPTY property — forces the RELEASED lane. It is load-bearing:
      # `.github/ci/remote-snapshot-pin` turns the snapshot lane on by default for every Gradle
      # invocation (see AGENTS.md -> Dependencies), and the records checked below (`design-map.json`,
      # `kit-cells.json`, `design/pages/pages.json`, `docs/KIT_COVERAGE.md`) are committed and
      # describe the released line. Let the default through and this manifest holds snapshot-only
      # components, every `--check` reports stale against a sheet nobody committed, and regenerating
      # at that point would commit those components into a record CI validates on the released lane.
      - name: Discover previews
        if: needs.changes.outputs.inert != 'true'
        run: ./gradlew :remote-catalog:composePreviewDiscover -PremoteSnapshot= --stacktrace

      # The second sheet, `remote-widgets` (Mobile Launcher Widgets). Same contract — discovery is
      # what turns its annotations into an inventory — and `check` carries
      # `verifyNoRemoteMaterial3`, the rule that keeps it a design system of its own. It has no kit,
      # so none of the design-map, kit-cell or page-join records below describe it.
      - name: Launcher widgets — assemble, discover, verify
        if: needs.changes.outputs.inert != 'true'
        run: >
          ./gradlew :widget-catalog:assembleDebug :widget-catalog:composePreviewDiscover
          :widget-catalog:verifyNoRemoteMaterial3 --stacktrace

      # design-map.json is an OUTPUT — projected from the annotations that were just discovered —
      # and it is committed, so it can go stale the moment a component is added or a reference is
      # repointed. A stale map is silent in the worst way: parity keeps comparing yesterday's
      # components and the imported kit pages keep linking to previews that have moved.
      #
      # `--check` regenerates into a temp dir and diffs; it never writes the working tree.
      - name: design-map.json is up to date
        if: needs.changes.outputs.inert != 'true'
        run: scripts/design-map.sh --check

      # kit-cells.json records how much of each published kit set this sheet actually DRAWS — the
      # question `kit-sets.json` does not ask, which is how this sheet came to draw 15 of the `Card`
      # set's 45 cells with every test green (yschimke/wear-m3-catalog#158).
      - name: kit-cells.json is up to date
        if: needs.changes.outputs.inert != 'true'
        run: scripts/kit-cells.sh --check

      # The page join is the third committed output projected from the map. `design/pages/pages.json`
      # records, per kit node, the preview that implements it, and the server draws every node it
      # does not know about with a dashed red outline meaning "no code behind this". `--check`
      # recomputes in memory and diffs; it needs no Figma token and never writes the working tree.
      - name: The imported page join is up to date
        if: needs.changes.outputs.inert != 'true'
        run: node scripts/import-figma-pages.mjs --check

      # And that the join reaches the whole map. It once did not, and nothing said so: the published
      # `/remote-m3/pages/` surface linked 22 of 1845 nodes — the component-level references and
      # nothing below them — while this sheet's map resolved 228 (yschimke/wear-m3-catalog#316).
      - name: The page join reaches the whole map
        if: needs.changes.outputs.inert != 'true'
        run: |
          set -euo pipefail
          node scripts/import-figma-pages.mjs --relink --require-full-join
          git diff --exit-code -- design/pages/pages.json

      # `docs/KIT_COVERAGE.md` reads the two records gated directly above and nothing else, so it
      # is a projection of files this job has already proved fresh.
      - name: docs/KIT_COVERAGE.md is up to date
        if: needs.changes.outputs.inert != 'true'
        run: node scripts/kit-coverage.mjs --check

      # ── THE TWO SHEETS STILL PAIR ──────────────────────────────────────────────────────────────
      # This sheet pairs with the Wear one (`:catalog` in yschimke/wear-m3-catalog) component by
      # component through `parallel`, and every `parallel` is declared HERE. So the gate lives here
      # too, and it needs the Wear sheet's discovered manifest beside this one.
      #
      # PINNED, not `main`: `.github/ci/wear-m3-catalog-ref` names the commit. A gate that floats on
      # another repository's head can redden this one for a change nobody here made. Bump the pin in
      # a commit (it is one line) when the Wear sheet renames or adds a component, and fix any
      # pairing the gate then reports in the same pull request.
      - name: Check out the Wear sheet
        if: needs.changes.outputs.inert != 'true'
        id: wear
        run: echo "ref=$(tr -d '[:space:]' < .github/ci/wear-m3-catalog-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.inert != 'true'
        with:
          repository: yschimke/wear-m3-catalog
          ref: ${{ steps.wear.outputs.ref }}
          path: .wear-m3-catalog
          persist-credentials: false
      - name: Discover the Wear sheet
        if: needs.changes.outputs.inert != 'true'
        run: ./gradlew -p .wear-m3-catalog :catalog:composePreviewDiscover --stacktrace
      - name: The two sheets still pair
        if: needs.changes.outputs.inert != 'true'
        run: scripts/parallel-map.sh .wear-m3-catalog/catalog/build/compose-previews/previews.json

      # The parity issue index is keyed on a `preview:` id inside each issue's
      # `compose-parity-locator/v1` block. Renaming a cell points a locator at a preview that no
      # longer exists and every other check stays green (yschimke/wear-m3-catalog#305).
      #
      # THE CHECKER IS UPSTREAM, beside the parser it has to agree with, and PINNED TO A COMMIT:
      # 26608e7 is compose-ai-tools#5214, which added `check-parity-locators.mjs`. Bumping is a
      # one-line commit, and the reason to bump is a fix to the checker rather than a schedule.
      - name: Check out the locator checker
        if: needs.changes.outputs.inert != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: 26608e78bc12c930ff03d09075f74ec2f7185656
          path: compose-ai-tools
          persist-credentials: false

      # The BASELINE, and what turns "some issue is broken" into "this pull request broke it": the
      # delivery branch's `preview-index.json` is what the catalog last actually served, so an id
      # that was served and is not drawn in this tree is this change's doing, while one that was
      # never served is somebody's typo and only warns.
      #
      # The delivery branch moved with the split. Until this repository's first publish lands on
      # `yschimke/remote-m3-catalog-out`, the last index served is still the one on
      # `yschimke/wear-m3-catalog-out`, so fall back to it rather than failing every pull request.
      - name: Fetch the served baseline
        if: needs.changes.outputs.inert != 'true'
        run: |
          set -euo pipefail
          for repo in remote-m3-catalog-out wear-m3-catalog-out; do
            if git fetch --depth=1 "https://github.com/yschimke/$repo.git" design-artifacts/remote-m3; then
              git show FETCH_HEAD:preview-index.json > "$RUNNER_TEMP/remote-m3-index.json"
              echo "baseline: yschimke/$repo"
              exit 0
            fi
          done
          echo '::error::no design-artifacts/remote-m3 branch to read a baseline from'
          exit 1

      # Both repositories' issues: the `remote-m3` parity issues filed before the split live on
      # yschimke/wear-m3-catalog, and the checker skips locators naming any other system.
      - name: Parity locators still name a cell this catalog draws
        if: needs.changes.outputs.inert != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node compose-ai-tools/scripts/design-artifacts/check-parity-locators.mjs \
            --repo ${{ github.repository }} \
            --repo yschimke/wear-m3-catalog \
            --manifest "remote-m3=remote-catalog/build/compose-previews/previews.json" \
            --published "remote-m3=$RUNNER_TEMP/remote-m3-index.json"

      - uses: actions/upload-artifact@v7.0.1
        if: always() && needs.changes.outputs.inert != 'true'
        with:
          name: previews-manifest
          path: remote-catalog/build/compose-previews/previews.json
          if-no-files-found: warn

  test:
    name: Unit tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.inert != 'true'
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.inert != 'true'
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # `:remote-catalog`'s tests read the renders, so it renders first (remote-catalog/build.gradle.kts).
      - run: ./gradlew test --stacktrace
        if: needs.changes.outputs.inert != 'true'
      - if: always() && needs.changes.outputs.inert != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  ktfmt:
    name: ktfmtCheck
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.inert != 'true'
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.inert != 'true'
        with:
          cache-read-only: 'true'
      - run: ./gradlew ktfmtCheck --stacktrace
        if: needs.changes.outputs.inert != 'true'

  spec:
    name: Validate catalog spec
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.inert != 'true'
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.inert != 'true'
        with:
          repository: yschimke/compose-ai-tools
          # Pinned, never `main`: compose-ai-tools#5714 moved this validator into the
          # `@design-parity/export-driver` package and deleted the script, which turned this job red
          # on every PR with no change here. This is the last commit that carries it; move to the
          # package's `design-artifacts validate-catalog-spec` in a change of its own.
          ref: 30201769cc1103f6f943fbf10e7cf93858fdf6cd
          path: compose-ai-tools
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        if: needs.changes.outputs.inert != 'true'
        with:
          node-version: 24.21.0
      # The Remote sheet's spec still carries its inventory as `groups`, so this is not a pre-flight
      # over annotations but the check on the inventory itself: every `preview` and
      # `motionPreview` it names has to resolve to a real `@Preview`.
      - name: validate-catalog-spec
        if: needs.changes.outputs.inert != 'true'
        run: |
          node compose-ai-tools/scripts/design-artifacts/validate-catalog-spec.mjs \
            --spec remote-catalog/catalog.spec.json --module-dir remote-catalog
          node compose-ai-tools/scripts/design-artifacts/validate-catalog-spec.mjs \
            --spec widget-catalog/catalog.spec.json --module-dir widget-catalog

  pages:
    name: Figma page resolution
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.inert != 'true'
      - uses: actions/setup-node@v7.0.0
        if: needs.changes.outputs.inert != 'true'
        with:
          node-version: 24.21.0
      # Which pages the import covers, and what each one is called. Both answers are published URLs
      # (`/{system}/pages/{id}`), and the page list is discovered from the Figma file rather than
      # hand-kept — so the slug rule is the only thing holding those URLs still. Needs no token:
      # it exercises the resolver against fixtures.
      - run: node --test scripts/import-figma-pages.test.mjs
        if: needs.changes.outputs.inert != 'true'

      # What counts as a cell a sheet draws. The coverage record this decides is committed and
      # reconciled in the `build` job above, so a bug here would move every number in it at once and
      # the diff would look like a change to the catalog rather than to the counter.
      - run: node --test scripts/kit-cells.test.mjs
        if: needs.changes.outputs.inert != 'true'

      # What counts as a broken pairing between the two sheets. The gate it backs runs in the `build`
      # job (it needs both discovered manifests, the Wear one from a pinned checkout); its pure half
      # is fixture-driven and belongs here beside the other script tests.
      - run: node --test scripts/parallel-map.test.mjs
        if: needs.changes.outputs.inert != 'true'

      # The PR-body repair, which `pr-body-syntax.yml` runs UNATTENDED against real descriptions.
      # Both failure modes are silent: a matcher that over-reaches rewrites someone's prose, one
      # that under-reaches leaves the evidence images broken and the PR looking like the author
      # never rendered anything. It lives here rather than as a second job in that workflow because
      # this is where this repo already runs `node --test` over its scripts.
      - run: node --test .github/scripts/fix-pr-body-markdown.test.mjs
        if: needs.changes.outputs.inert != 'true'

      # The snapshot probe's decision logic — what makes `remote-snapshot-probe.yml` ping a human
      # or stay quiet. Pure and stdlib-only, so it runs beside the resolver test rather than
      # needing the probe's own Pillow/Android environment. A watchdog whose comparison silently
      # stopped working would report "nothing changed" forever, which is the one failure mode it
      # cannot have.
      - run: python3 scripts/test_remote_snapshot_probe.py
        if: needs.changes.outputs.inert != 'true'
