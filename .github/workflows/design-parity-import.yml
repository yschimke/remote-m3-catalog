name: Design parity reference cache

# Import the Figma side on its own cadence. Design parity reads this committed cache and therefore
# makes zero live Figma calls on ordinary code pushes; a rate limit costs freshness, not coverage.

# Daily at 06:30 UTC, plus a button. This is the ONLY lane that may spend the Figma token on
# references: parity runs read the cache it commits and make zero calls (design-parity.yml), which
# is the split issue #289 exists for.
#
# Cheap on a quiet day, because the import is version-gated: an unchanged kit costs ONE request
# (the file `version` check) and refreshes nothing. The expensive path only runs when the kit has
# actually moved, so a daily cadence buys freshness rather than traffic.
#
# 06:30 and not m3-catalog's 04:30 or wear-m3-catalog's 05:30 on purpose. The token is per-user,
# so its rate limiter is shared across every repo that holds it — two catalogs importing at once
# would throttle each other. An hour's offset keeps them apart; each import is ~10-20 minutes when
# the kit has moved.
#
# BOOTSTRAP. `design-parity/reference` on `yschimke/remote-m3-catalog-out` starts empty: the cache
# the Wear sheet built lives on `yschimke/wear-m3-catalog-out` and did not move with the split.
# `design-parity.yml` reads it with `require-reference-cache` (default true), so dispatch this
# workflow until it reports `complete=true` before expecting a parity board — an empty or missing
# branch fails loudly rather than silently fetching every reference live.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      design_parity_ref:
        description: Test an unreleased yschimke/design-parity ref instead of the published CLI.
        type: string
        required: false
        default: ''

permissions: {}

concurrency:
  group: design-parity-reference-import
  cancel-in-progress: false

jobs:
  import:
    name: M3 Wear OS Apps Design Kit
    if: ${{ github.repository == 'yschimke/remote-m3-catalog' }}
    uses: yschimke/design-parity/.github/workflows/design-parity-import-reusable.yml@main
    permissions:
      contents: write
    with:
      design-parity-ref: ${{ inputs.design_parity_ref || '' }}
      publication-repository: yschimke/remote-m3-catalog-out
      # The snapshot lane, matching `design-parity.yml`: the board reads this cache for the nodes
      # ITS map names, and that map is projected on the pinned snapshot lane.
      design-map-command: >
        test -s .github/ci/remote-snapshot-pin &&
        ./gradlew :remote-catalog:composePreviewDiscover --stacktrace &&
        scripts/design-map.sh
      timeout-minutes: 60
    secrets:
      figma-token: ${{ secrets.FIGMA_TOKEN }}
      publication-token: ${{ secrets.ARTIFACTS_TOKEN }}
